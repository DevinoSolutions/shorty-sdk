# npm release for @aishorty/sdk — runs in the PUBLIC mirror repo
# (DevinoSolutions/shorty-sdk) only; GitHub ignores nested .github dirs in the
# private monorepo, so this file is inert there and becomes the root workflow
# after `scripts/sdk/sync-mirror.mjs` copies the package to the mirror.
#
# Publish flow (Changesets governs the version): `changeset version` is run and
# reviewed in the PRIVATE monorepo (packages/sdk), the bump lands here via the
# mirror sync, and this workflow publishes when package.json is ahead of npm.
# Provenance requires a PUBLIC source repo — that is WHY publishing lives here.
#
# Auth: npm Trusted Publishing (OIDC) only — registered on npmjs.com
# 2026-11-02 for DevinoSolutions/shorty-sdk + release.yml (npm matches the
# workflow filename exactly, so do not rename this file). No NPM_TOKEN secret
# is used. OIDC needs a GitHub-hosted runner, `id-token: write`, and
# npm >= 11.5.1.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # sigstore provenance + npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      # Trusted publishing requires npm >= 11.5.1; setup-node's bundled npm
      # may be older.
      - run: npm install -g npm@latest

      # prepublishOnly (typecheck + unit tests + build) runs inside `npm
      # publish`, so a red suite blocks the release without a separate job.
      - name: Publish when package.json is ahead of npm
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view @aishorty/sdk version 2>/dev/null || echo "none")
          echo "local=$LOCAL published=$PUBLISHED"
          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "Version $LOCAL already on npm — nothing to publish."
            exit 0
          fi
          npm publish --provenance --access public
